server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolveur DNS interne de Docker : force nginx a re-resoudre "backend"
    # dynamiquement (au lieu de mettre en cache l'IP une seule fois au demarrage)
    # -- indispensable car l'IP du conteneur backend change a chaque fois qu'il
    # est recree (rebuild, redemarrage), ce qui provoquait des erreurs 502
    # Bad Gateway apres chaque mise a jour du backend sans redemarrer le frontend.
    resolver 127.0.0.11 valid=10s;

    # Reverse proxy vers le Core ATS Service (Spring Boot) — evite tout souci CORS
    # en production puisque frontend et API sont servis sous la meme origine.
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;   # coherent avec la limite d'upload CV cote Spring
    }

    # SPA Angular : toute route inconnue retombe sur index.html (routing côté client)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets buildés (hashés par Angular CLI)
    location ~* \.(?:css|js|woff2?|ttf|svg|ico|png|jpg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
